<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
    body {
        background-color: lightslategray;
        font-family: Arial;
    }
    .MainContainer {
        width: 1000px;
        margin: auto;
        background-color: white;
        border-radius: 10px;
        padding: 20px;
    }
    .cont1 {
        background-color: purple;
        color: white;
        padding: 20px;
        border-radius: 10px;
        text-align: center;
    }
    .cont2 {
        background-color: blueviolet;
        color: white;
        padding: 20px;
        border-radius: 10px;
        margin-top: 20px;
    }
    .cont3 {
        background-color: green;
        color: white;
        padding: 20px;
        border-radius: 10px;
        margin-top: 20px;
    }
    h1, h2 {
        margin: 0;
    }
    ul, ol, dl {
        margin-left: 20px;
    }
    form {
        display: flex;
        flex-direction: column;
    }
    input, textarea, select {
        margin: 5px 0;
        padding: 8px;
    }
     input[type=submit] {
        width: 100px;
        height: 35px;
        background-color: purple;
        cursor: pointer;
    }
</style>
</head>
<body>
<div class="MainContainer">

    <div class="cont1">
        <h1>Hi, Im Kristof Lumboy</h1>
        <p>Web making beginner</p>
    </div>

    <div class="cont2">
        <h2>About me</h2>
        <p>Im Kristof I like hanging out with my friends.</p>
    </div>

    <div class="cont3">
        <h2>What i do </h2>
        <ul>
            <li>Sleep</li>
            <li>Eat</li>
            <li>Play</li>
            <li>Repeat</li>
        </ul>
       <h2>My friends</h2>
        <ol>
            <li>Cian</li>
            <li>Sia</li>
            <li>Ken</li>
        </ol>
    </div>

    <div class="cont2">
        <h2>What am I to you?</h2>
        <form>
            <select>
                <option>Classmate</option>
                <option>Friends</option>
                <option>Stranger</option>
            </select>

            <label>How did you find me?</label>
            <select>
                <option>School</option>
                <option>Through Friends</option>
                <option>Public</option>
            </select>
            <label>What do you want us to be?</label>
            <textarea></textarea>
            <input type="submit" value="Submit">
        </form>
    </div>
</div>
</body>
</html>
